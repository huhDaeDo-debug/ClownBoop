<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bocina Payaso</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.webapp">
</head>
<body>
    <!-- El botón es un elemento enfocable que responde a Enter/Click -->
    <button id="boton-bocina" tabindex="0">
        ¡BOCINA!<br><small>(Presiona OK/Enter)</small>
    </button>
    
    <!-- Precarga del audio. No se reproduce automáticamente por políticas del navegador. -->
    <audio id="audio-bocina" src="bocina.mp3" preload="auto"></audio>

    <script src="app.js"></script>
</body>
</html>
